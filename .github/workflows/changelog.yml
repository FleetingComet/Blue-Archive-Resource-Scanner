name: Changelog

on:
    # push:
    #     branches:
    #         - main
    #     tags:
    #         - "v*"

    workflow_dispatch:

jobs:
    changelog:
        name: Generate changelog
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: Generate a changelog
              uses: orhun/git-cliff-action@v4.8.0
              with:
                  config: cliff.toml
                  args: --verbose --latest --prepend CHANGELOG.md
              env:
                  #   OUTPUT: CHANGELOG.md
                  GITHUB_REPO: ${{ github.repository }}

            - name: Commit CHANGELOG.md
              uses: stefanzweifel/git-auto-commit-action@v7.2.0
              with:
                  commit_message: "chore: update CHANGELOG.md [skip ci]"
                  file_pattern: "CHANGELOG.md"
