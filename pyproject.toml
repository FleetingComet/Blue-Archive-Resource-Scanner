[project]
name = "bluearchive-scanner"
version = "0.1.4"
description = " A Python-based tool to scan and count owned resources in Blue Archive."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "levenshtein==0.27.1",
    "numpy==2.1.3",
    "opencv-python==4.10.0.84",
    "pytesseract==0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
