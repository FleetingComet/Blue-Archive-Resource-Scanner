[project]
name = "blue-archive-scanner"
version = "1.0.0"
description = "A Python-based tool to scan and count owned resources in Blue Archive."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "levenshtein==0.27.3",
    "mss==10.2.0",
    "numpy==2.5.1",
    "onnxruntime==1.27.0",
    "opencv-python==5.0.0.93",
    "pyautogui==0.9.54",
    "pydantic-core==2.46.4",
    "pydantic==2.13.4",
    "pytest==9.1.1",
    "pywin32==312",
    "rapidfuzz==3.14.5",
    "rapidocr==3.9.1",
    "requests==2.34.2",
    "rich==15.0.0",
    "windows-capture==2.0.0",
    "tenacity==9.1.4",
]


[dependency-groups]
dev = [
    "git-cliff>=2.13.1",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
